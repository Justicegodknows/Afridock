name: afridock

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afridock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afridock}
      POSTGRES_DB: ${POSTGRES_DB:-afridock}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afridock}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted, open-source inference (see CLAUDE.md's #1 architectural
  # constraint: low-cost AI via open-source models). Runs a small
  # open-weight model on CPU with zero API cost and no credentials — the
  # real default inference path for local/self-hosted deployments, ahead of
  # paid Hugging Face Inference API / commercial fallback. First run:
  # `make ollama-pull` (one-time ~1.3GB download, cached in the named volume).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://afridock_app:${APP_DB_PASSWORD:-afridock_app_local_dev}@postgres:5432/afridock}
      MIGRATIONS_DATABASE_URL: ${MIGRATIONS_DATABASE_URL:-postgresql+asyncpg://afridock:afridock@postgres:5432/afridock}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-afridock_app_local_dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres-data:
  ollama-data:
