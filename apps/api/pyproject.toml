[tool.poetry]
name = "afridock-api"
version = "0.1.0"
description = "Afridock API — FastAPI backend for the AfricaAI platform"
authors = ["Afridock Engineering"]
readme = "README.md"
packages = [{ include = "afridock_api", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "0.111.*"
uvicorn = { extras = ["standard"], version = "0.30.*" }
gunicorn = "22.0.*"
pydantic = "2.8.*"
pydantic-settings = "^2.3"
sqlalchemy = { extras = ["asyncio"], version = "2.0.*" }
alembic = "1.13.*"
asyncpg = "^0.29"
fastapi-users = { extras = ["sqlalchemy"], version = "13.0.*" }
authlib = "1.3.*"
celery = "5.4.*"
redis = "^5.0"
slowapi = "0.1.9"
litellm = "1.40.*"
huggingface-hub = "0.24.*"
httpx = "0.27.*"
structlog = "24.1.*"
opentelemetry-sdk = "1.25.*"
prometheus-client = "0.20.*"
pgvector = "^0.3"
cryptography = "^42.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "8.2.*"
pytest-asyncio = "0.23.*"
pytest-bdd = "8.1.*"
factory-boy = "^3.3"
types-PyYAML = "^6.0"
ruff = "^0.5"
black = "^24.4"
mypy = "^1.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/etc. are meant to be called in argument
# defaults — that's the framework's own dependency-injection idiom, not the
# mutable-default-argument bug B008 exists to catch.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "afridock_api.auth.dependencies.require_role",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
